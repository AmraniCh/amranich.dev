# Presentations page (/presentations/). To add a presentation, add an item here.
#
# Fields:
#   id           unique, lowercase with dashes (also the #anchor on the page)
#   title        shown in bold
#   section      "Paper presentations", "Project presentations" or "Coursework"
#   paper        optional: authors, venue, year
#   subtitle     optional: another line under the title, for example the original title
#   context      module or event
#   supervisor   optional: for example "Pr. First Last", shown on its own line
#   jury         optional: same format, shown as "Jury: ..." on its own line
#   date         optional: for example "Mar 2026"
#   description  1-2 sentences, in my own words
#   slides       optional: link to the slides
#   project      optional: a project title from public/0user.json; its slides link is used
#   links        optional: extra links, for example { label: paper, text: pdf, url: ... }
#   language     "in English" or "in French", shown next to the slides link

